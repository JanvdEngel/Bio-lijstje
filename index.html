<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1a15">
<title>Het Bio Lijstje</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1a15;
    --bg-raised: #232019;
    --text: #ece7db;
    --muted: #928c7c;
    --harvest: #c97d3f;
    --warn: #d95b4a;
    --leaf: #8caa5c;
    --line: #35322a;
    --ah: #5b8fd6;
    --jumbo: #e0b23c;
    --lidl: #4fb0a6;
    --aldi: #7a6fd0;
    --dirk: #d43a3a;
    --plus: #4a8f5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 3rem;
  }
  .chalk-texture{
    position: fixed; inset: 0; pointer-events: none; opacity: 0.05; mix-blend-mode: overlay;
    background-image: radial-gradient(circle at 20% 30%, #fff 0.5px, transparent 0.5px),
                       radial-gradient(circle at 70% 60%, #fff 0.5px, transparent 0.5px);
    background-size: 4px 4px, 5px 5px;
  }
  header{
    padding: 2.2rem 1.4rem 1rem;
    text-align: center;
    position: relative;
  }
  .sibling-link{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--harvest);
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 12px;
    text-decoration:none;
    white-space:nowrap;
    display:inline-block;
    margin-bottom:0.9rem;
    transition:border-color .2s;
  }
  .sibling-link:hover{ border-color:var(--harvest); }
  .eyebrow{
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--leaf);
    margin: 0.6rem 0 0;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 3rem;
    line-height: 0.95;
    margin: 0;
    color: var(--text);
  }
  .updated{
    font-size: 0.78rem;
    color: var(--muted);
    margin: 0 0 0.8rem;
  }

  main{ max-width: 620px; margin: 0 auto; padding: 0 1rem; }
  @media (min-width: 760px){
    main{ max-width: 1180px; }
  }

  .summary-bar{
    display: flex; justify-content: center; gap: 1.4rem;
    margin: 0.4rem 0 1.6rem;
    flex-wrap: wrap;
  }
  .store-toggle{
    display:flex; align-items:center; gap:0.45rem;
    background:none;
    cursor:pointer;
    border:1px solid var(--tc, var(--line));
    border-radius:999px;
    padding:0.3rem 0.75rem 0.3rem 0.3rem;
    font-family:'Space Mono', monospace;
    color: var(--text);
    transition: opacity .2s, border-color .2s;
  }
  .store-toggle-badge{
    width:1.5rem; height:1.5rem; border-radius:50%;
    background: var(--tc, var(--muted));
    color: var(--bg); font-weight:700; font-size:0.65rem;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .store-toggle-label{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.03em; }
  .store-toggle-count{ font-size:0.68rem; color:var(--muted); }
  .store-toggle.off{ opacity:0.4; }
  .store-toggle.off .store-toggle-badge{ background: var(--muted); }
  .store-toggle:hover{ border-color: var(--tc, var(--harvest)); }

  .store-columns{
    display: grid; grid-template-columns: 1fr; gap: 1.8rem;
  }
  @media (min-width: 760px){
    .store-columns{ grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); align-items: start; }
  }

  .store-section{ margin-bottom: 1.6rem; }
  @media (min-width: 760px){
    .store-section{ margin-bottom: 0; }
  }
  .store-header{
    display:flex; align-items:center; gap:0.7rem; margin-bottom: 0.9rem;
  }
  .store-badge{
    flex: 0 0 auto;
    width: 2.5rem; height: 2.5rem;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1.1rem;
    color: var(--bg);
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    border: 2px solid rgba(236,231,219,0.35);
  }
  .store-header h2{
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.55rem;
    margin: 0; color: var(--text);
  }
  .store-header .count{
    font-size: 0.75rem; color: var(--muted); margin-left: 0.1rem;
  }

  .grid{
    display: grid; grid-template-columns: 1fr; gap: 0.7rem;
  }
  @media (min-width: 560px) and (max-width: 759px){
    .grid{ grid-template-columns: 1fr 1fr; }
  }

  .card{
    position: relative;
    background: var(--bg-raised);
    border-radius: 10px;
    padding: 0.85rem 1rem 0.95rem;
    border: 1px solid var(--line);
    border-left: 3px solid var(--card-accent, var(--leaf));
    transition: border-color .2s;
  }
  .card:hover{ border-color: var(--leaf); }
  .card .name{
    font-size: 0.96rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .price-row{
    display:flex; align-items:baseline; gap:0.55rem; margin-top:0.5rem; flex-wrap:wrap;
  }
  .price-now{ font-family:'Space Mono', monospace; font-size:1rem; font-weight:700; color: var(--harvest); }
  .price-was{ font-family:'Space Mono', monospace; font-size:0.78rem; color: var(--muted); text-decoration: line-through; }
  .savings{
    margin-top:0.3rem; font-size:0.74rem; color: var(--leaf);
  }
  /* Actieprijs geldt pas bij meerdere stuks — hoort pal bij de prijs, anders
     lijkt het een gewone stuksprijs. */
  .voorwaarde{
    margin-top:0.3rem; font-size:0.74rem; color: var(--harvest);
    font-family:'Space Mono', monospace; line-height:1.35;
  }
  .history-note{
    margin-top:0.4rem; font-size:0.74rem; padding-top:0.4rem;
    border-top: 1px dashed var(--line);
  }
  .history-good{ color: var(--leaf); }
  .history-warn{ color: var(--warn); }

  .card-extra{ display:none; }
  .store-section.expanded .card-extra{ display:block; }
  .toggle-more{
    display:block;
    width:100%;
    margin-top:0.7rem;
    font-family:'Space Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:none;
    border:1px dashed var(--line);
    border-radius:10px;
    color:var(--muted);
    padding:0.5rem;
    cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  .toggle-more:hover{ border-color:var(--harvest); color:var(--harvest); }

  .empty-note{
    font-size: 0.82rem; color: var(--muted); font-style: italic;
    padding: 0.6rem 0;
  }

  .empty-state{
    text-align:center; padding: 2rem 1.5rem; color: var(--muted);
    background: var(--bg-raised);
    border-radius: 16px;
    border: 1px dashed var(--line);
  }
  .empty-state .big{ font-family:'Fraunces', serif; font-weight:600; font-size:1.5rem; color: var(--text); display:block; margin-bottom:0.3rem;}
  code{
    background: rgba(0,0,0,0.25); padding:0.1rem 0.4rem; border-radius:5px; font-size:0.85em;
  }
  footer{
    text-align:center; font-size:0.72rem; color: var(--muted); opacity:0.8; margin-top:2rem;
  }
</style>
</head>
<body>
<div class="chalk-texture"></div>

<header>
  <a class="sibling-link" href="https://JanvdEngel.github.io/Seizoenswijzer/">← Seizoenswijzer</a>
  <h1>Het Bio Lijstje</h1>
  <p class="eyebrow">Deze week</p>
</header>

<main>
  <div id="content">
    <div class="empty-state">
      <span class="big">Nog niets geladen</span>
      Even geduld...
    </div>
  </div>
</main>

<footer>
  <p class="updated" id="updated">nog niets geladen...</p>
  bio groente &amp; fruit-aanbiedingen<br>
  Aanbiedingen via <a href="https://www.prijsprofeet.nl/" style="color:inherit">PrijsProfeet</a>
  &amp; <a href="https://www.folderz.nl/" style="color:inherit">Folderz.nl</a>
</footer>

<script>
const STORE_COLORS = { AH: 'var(--ah)', Jumbo: 'var(--jumbo)', Lidl: 'var(--lidl)', Aldi: 'var(--aldi)', Dirk: 'var(--dirk)', Plus: 'var(--plus)' };
const STORE_BADGES = { AH: 'ah', Jumbo: 'J', Lidl: 'L', Aldi: 'A', Dirk: 'D', Plus: 'P' };
let data = null;

const HIDDEN_STORES_KEY = 'bioBordHiddenStores';
let hiddenStores = new Set();
try {
  hiddenStores = new Set(JSON.parse(localStorage.getItem(HIDDEN_STORES_KEY) || '[]'));
} catch (e) { /* corrupte opslag negeren, alles blijft zichtbaar */ }

function saveHiddenStores() {
  try { localStorage.setItem(HIDDEN_STORES_KEY, JSON.stringify([...hiddenStores])); } catch (e) {}
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' }) +
         ' om ' + d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
}

function fmtShortDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
}

function renderHistoryNote(item) {
  if (item.laagste_ooit_prijs === undefined || item.laagste_ooit_prijs === null) return '';
  if (item.actieprijs <= item.laagste_ooit_prijs) {
    return `<div class="history-note history-good">&#127942; Laagste prijs die ik zag (${item.eerder_gezien} eerdere ${item.eerder_gezien === 1 ? 'prijs' : 'prijzen'} gezien)</div>`;
  }
  const verschil = (item.actieprijs - item.laagste_ooit_prijs).toFixed(2);
  return `<div class="history-note history-warn">&#9888;&#65039; Eerder goedkoper: &euro;${item.laagste_ooit_prijs.toFixed(2)} op ${fmtShortDate(item.laagste_ooit_datum)} (nu &euro;${verschil} duurder)</div>`;
}

const STORE_VISIBLE_CAP = 4;

function renderAanbiedingCard(item, storeColor, isExtra) {
  const savingsPct = item.normale_prijs
    ? Math.round((1 - item.actieprijs / item.normale_prijs) * 100)
    : null;
  return `
    <div class="card${isExtra ? ' card-extra' : ''}" style="--card-accent:${storeColor}">
      <div class="name">${item.naam.toLowerCase()}</div>
      <div class="price-row">
        <span class="price-now">&euro;${item.actieprijs.toFixed(2)}</span>
        ${item.normale_prijs ? `<span class="price-was">&euro;${item.normale_prijs.toFixed(2)}</span>` : ''}
      </div>
      ${savingsPct && savingsPct > 0 ? `<div class="savings">${savingsPct}% korting</div>` : ''}
      ${item.voorwaarde ? `<div class="voorwaarde">&#9888;&#65039; alleen bij: ${item.voorwaarde.toLowerCase()}</div>` : ''}
      ${renderHistoryNote(item)}
    </div>`;
}

function render() {
  const content = document.getElementById('content');
  if (!data) {
    content.innerHTML = `
      <div class="empty-state">
        <span class="big">Nog geen data</span>
        Draai eerst <code>fetch_bio_prices.py</code> op je Pi, dan verschijnt hier
        de bio-update van deze week.
      </div>`;
    return;
  }

  document.getElementById('updated').textContent = 'Bijgewerkt: ' + fmtDate(data.laatst_bijgewerkt);

  const aanbiedingen = data.aanbiedingen || {};
  const stores = Object.keys(aanbiedingen);
  const totaal = stores.reduce((sum, s) => sum + (aanbiedingen[s] || []).length, 0);

  if (totaal === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <span class="big">Geen bio-acties deze week</span>
        Bij AH, Jumbo en Lidl loopt op dit moment geen bio groente/fruit-actie.
        Dat gebeurt vaker dan je zou denken &mdash; acties zijn schaars, kom
        volgende week terug.
      </div>`;
    return;
  }

  const summaryHtml = `
    <div class="summary-bar">
      ${stores.map(s => {
        const off = hiddenStores.has(s);
        return `
        <button class="store-toggle${off ? ' off' : ''}" type="button" data-store="${s}" style="--tc:${STORE_COLORS[s] || 'var(--muted)'}" aria-pressed="${!off}">
          <span class="store-toggle-badge" aria-hidden="true">${STORE_BADGES[s] || s[0]}</span>
          <span class="store-toggle-label">${s}</span>
          <span class="store-toggle-count">${(aanbiedingen[s] || []).length}</span>
        </button>`;
      }).join('')}
    </div>`;

  const sectionsHtml = stores.map(s => {
    const items = aanbiedingen[s] || [];
    const color = STORE_COLORS[s] || 'var(--leaf)';
    const extraCount = Math.max(0, items.length - STORE_VISIBLE_CAP);
    const body = items.length
      ? `<div class="grid">${items.map((i, idx) => renderAanbiedingCard(i, color, idx >= STORE_VISIBLE_CAP)).join('')}</div>` +
        (extraCount > 0 ? `<button class="toggle-more" type="button" data-more="+${extraCount} meer tonen" data-less="Toon minder">+${extraCount} meer tonen</button>` : '')
      : `<p class="empty-note">Geen bio-acties bij ${s} deze week.</p>`;
    return `
      <div class="store-section" data-store="${s}"${hiddenStores.has(s) ? ' style="display:none"' : ''}>
        <div class="store-header">
          <span class="store-badge" style="background:${color}" aria-hidden="true">${STORE_BADGES[s] || s[0]}</span>
          <h2>${s}</h2>
          <span class="count">${items.length} ${items.length === 1 ? 'actie' : 'acties'}</span>
        </div>
        ${body}
      </div>`;
  }).join('');

  content.innerHTML = `
    ${summaryHtml}
    <div class="store-columns">${sectionsHtml}</div>
  `;
}

document.addEventListener('click', (e) => {
  const moreBtn = e.target.closest('.toggle-more');
  if (moreBtn) {
    const section = moreBtn.closest('.store-section');
    const expanded = section.classList.toggle('expanded');
    moreBtn.textContent = expanded ? moreBtn.dataset.less : moreBtn.dataset.more;
    return;
  }

  const toggleBtn = e.target.closest('.store-toggle');
  if (toggleBtn) {
    const store = toggleBtn.dataset.store;
    const nowOff = toggleBtn.classList.toggle('off');
    toggleBtn.setAttribute('aria-pressed', String(!nowOff));
    if (nowOff) hiddenStores.add(store); else hiddenStores.delete(store);
    saveHiddenStores();
    const section = document.querySelector(`.store-section[data-store="${CSS.escape(store)}"]`);
    if (section) section.style.display = nowOff ? 'none' : '';
  }
});

fetch('data/bio_prices.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error('geen data'); return r.json(); })
  .then(json => { data = json; render(); })
  .catch(() => { data = null; render(); });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
<!-- GoatCounter: privacyvriendelijke bezoekersstatistiek (geen cookies, geen
     persoonsgegevens). Expliciet https i.p.v. protocol-relatief //, zodat het
     script ook versleuteld laadt zolang de site nog via http bereikbaar is. -->
<script data-goatcounter="https://hetbiolijstje.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
